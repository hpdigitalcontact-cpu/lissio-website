<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { firstName: '', lastName: '', company: '', dial: '+1 US', phone: '', heard: '', email: '', password: '', showPw: false, size: '', error: '', done: false };

  pill(on) { return on ? { bg: '#0E2419', fg: '#ffffff', br: '#0E2419' } : { bg: '#ffffff', fg: '#0E2419', br: '#E3E8E1' }; }

  set(key) { return (e) => this.setState({ [key]: e.target.value, error: '' }); }

  submit = () => {
    const s = this.state;
    if (!s.firstName.trim() || !s.lastName.trim()) return this.setState({ error: 'Add your first and last name.' });
    if (!s.company.trim()) return this.setState({ error: 'Add your company name.' });
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s.email.trim())) return this.setState({ error: 'Enter a valid email address.' });
    if (s.password.length < 8) return this.setState({ error: 'Password needs at least 8 characters.' });
    if (!s.size) return this.setState({ error: 'Tell us how many gardeners you are.' });
    this.createAccount(s);
  };

  createAccount = async (s) => {
    this.setState({ error: 'Creating your workspace…' });
    const db = window.getFPDB ? await window.getFPDB() : null;
    if (!db) return this.setState({ error: 'Connection problem — please try again.' });
    const { data, error } = await db.auth.signUp({
      email: s.email.trim(),
      password: s.password,
      options: {
        data: { company: s.company.trim(), team_size: s.size, first_name: s.firstName.trim(), last_name: s.lastName.trim(), phone: (s.dial + ' ' + s.phone).trim(), heard: s.heard },
        emailRedirectTo: location.origin + '/app.html'
      }
    });
    if (error) {
      const msg = /registered|exists/i.test(error.message) ? 'An account already exists with this email — log in instead.' : error.message;
      return this.setState({ error: msg });
    }
    if (typeof window.gtag === 'function') window.gtag('event', 'signup_complete', { team_size: s.size, source: s.heard || 'none' });
    if (typeof window.fbq === 'function') window.fbq('track', 'Lead', { content_name: 'workspace created' });
    if (!data.session) return this.setState({ error: 'Almost there — confirm your email from the link we just sent, then log in.' });
    this.setState({ done: true, error: '' });
    this._t = setTimeout(() => { window.location.href = './app.html?v=20261006b'; }, 1400);
  };

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const s = this.state;
    return {
      isForm: !s.done,
      isDone: s.done,
      doneTitle: (s.company.trim() || 'Your company') + ' is set up.',
      firstName: s.firstName, lastName: s.lastName, company: s.company, dial: s.dial,
      phone: s.phone, heard: s.heard, email: s.email, password: s.password, error: s.error,
      heardColor: s.heard ? '#0E2419' : '#8A978F',
      setFirstName: this.set('firstName'), setLastName: this.set('lastName'), setCompany: this.set('company'),
      setDial: this.set('dial'), setPhone: this.set('phone'), setHeard: this.set('heard'),
      setEmail: this.set('email'), setPassword: this.set('password'),
      pwType: s.showPw ? 'text' : 'password',
      pwLabel: s.showPw ? 'Hide' : 'Show',
      togglePw: () => this.setState(x => ({ showPw: !x.showPw })),
      sSolo: this.pill(s.size === 'solo'), sCrew: this.pill(s.size === 'crew'), sBiz: this.pill(s.size === 'biz'),
      pickSolo: () => this.setState({ size: 'solo', error: '' }),
      pickCrew: () => this.setState({ size: 'crew', error: '' }),
      pickBiz: () => this.setState({ size: 'biz', error: '' }),
      submit: this.submit
    };
  }
}
</script>
