  <div data-m="card" style="width:100%; max-width:420px; background:#F6F7F2; border-radius:24px; padding:34px 32px 26px; box-shadow:0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08)">
    <a href="./index.html" style="display:flex; align-items:center; justify-content:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; letter-spacing:-0.02em; color:#0E2419; white-space:nowrap">
      <span style="width:32px; height:32px; border-radius:9px; background:#1F8A4C; display:flex; align-items:center; justify-content:center; flex-shrink:0">
        <svg viewBox="6 3 20 26" style="width:15px; height:20px"><rect x="9" y="5" width="5.6" height="22" rx="2.8" fill="#fff"></rect><rect x="9" y="5" width="15" height="5.6" rx="2.8" fill="#fff"></rect><rect x="9" y="13.2" width="11" height="5.6" rx="2.8" fill="#8FD14F"></rect></svg>
      </span>
      Field Pilot
    </a>

    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <div>
        <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:-0.02em; line-height:1.08; font-size:28px; text-align:center; margin:20px 0 22px">Welcome back</h1>
        <div style="display:flex; flex-direction:column; gap:10px">
          <input type="email" autocomplete="email" placeholder="Email" value="{{ email }}" onInput="{{ setEmail }}" style="width:100%; padding:13px 14px; border:1px solid #E3E8E1; border-radius:10px; background:#fff; font-size:16px; color:#0E2419" />
          <div style="position:relative">
            <input type="{{ pwType }}" autocomplete="current-password" placeholder="Password" value="{{ password }}" onInput="{{ setPassword }}" onKeyDown="{{ onKey }}" style="width:100%; padding:13px 70px 13px 14px; border:1px solid #E3E8E1; border-radius:10px; background:#fff; font-size:16px; color:#0E2419" />
            <button type="button" onClick="{{ togglePw }}" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:transparent; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#166B3A; cursor:pointer">{{ pwLabel }}</button>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#C24545; min-height:16px">{{ error }}</div>
          <button type="button" onClick="{{ login }}" style="width:100%; padding:15px 22px; border:none; border-radius:12px; background:#0E2419; color:#fff; font-weight:700; font-size:16px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease" style-hover="transform:translateY(-1px); box-shadow:0 10px 24px rgba(14,36,25,0.25)">{{ loginLabel }}</button>
        </div>

          <button type="button" onClick="{{ toForgot }}" style="border:none; background:transparent; padding:0; font-size:13.5px; color:#166B3A; text-decoration:underline; cursor:pointer">I forgot my password</button>
          <a href="./signup.html?v=20261006c" style="font-weight:600">Sign up</a>
        </div>
      </div>

    <sc-if value="{{ isForgot }}" hint-placeholder-val="{{ false }}">
      <div>

        <p style="color:#5C6B62; font-size:14.5px; text-align:center; margin:0 0 20px">{{ resetText }}</p>
        <sc-if value="{{ resetNotSent }}" hint-placeholder-val="{{ true }}">

            <input type="email" autocomplete="email" placeholder="Email" value="{{ email }}" onInput="{{ setEmail }}" style="width:100%; padding:13px 14px; border:1px solid #E3E8E1; border-radius:10px; background:#fff; font-size:16px; color:#0E2419" />

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'login', email: '', password: '', showPw: false, error: '', loading: false, resetSent: false };

  validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); }

  login = () => {
    const s = this.state;
    if (!this.validEmail(s.email)) return this.setState({ error: 'Enter a valid email address.' });
    if (!s.password) return this.setState({ error: 'Enter your password.' });
    if (typeof window.gtag === 'function') window.gtag('event', 'login');
    this.setState({ loading: true, error: '' });
    this.doLogin(s.email.trim(), s.password);
  };

  componentDidMount() { this.autoRedirectIfLoggedIn(); }

  autoRedirectIfLoggedIn = async () => {
    const db = window.getFPDB ? await window.getFPDB() : null;
    if (!db) return;
    const { data } = await db.auth.getSession();
    if (data && data.session && window.fpIsLiveHost && window.fpIsLiveHost()) window.location.replace('./app.html?v=20261006c');
  };

  doLogin = async (email, password) => {
    const db = window.getFPDB ? await window.getFPDB() : null;
    if (!db) return this.setState({ loading: false, error: 'Connection problem — please try again.' });
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      const msg = /invalid/i.test(error.message) ? 'Wrong email or password.' : /confirm/i.test(error.message) ? 'Confirm your email first — check your inbox.' : error.message;
      return this.setState({ loading: false, error: msg });
    }
    window.location.href = './app.html?v=20261006c';
  };

  sendReset = () => {
    if (!this.validEmail(this.state.email)) return this.setState({ error: 'Enter a valid email address.' });
    this.setState({ resetSent: true, error: '' });
    if (window.getFPDB) window.getFPDB().then(db => { if (db) db.auth.resetPasswordForEmail(this.state.email.trim(), { redirectTo: location.origin + '/login.html' }); });
  };

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const s = this.state;
    return {
      isLogin: s.view === 'login',
      isForgot: s.view === 'forgot',
      email: s.email, password: s.password, error: s.error,
      setEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      setPassword: (e) => this.setState({ password: e.target.value, error: '' }),
      onKey: (e) => { if (e.key === 'Enter') this.login(); },
      pwType: s.showPw ? 'text' : 'password',
      pwLabel: s.showPw ? 'Hide' : 'Show',
      togglePw: () => this.setState(x => ({ showPw: !x.showPw })),
      loginLabel: s.loading ? 'Logging in…' : 'Log in',
      login: this.login,
      toForgot: () => this.setState({ view: 'forgot', error: '', resetSent: false }),
      toLogin: () => this.setState({ view: 'login', error: '' }),
      resetNotSent: !s.resetSent,
      resetText: s.resetSent ? 'If an account exists for ' + s.email.trim() + ', a reset link is on its way. Check your inbox.' : 'Enter your email and we\u2019ll send you a link to choose a new password.',
      sendReset: this.sendReset
    };
  }
}
</script>
